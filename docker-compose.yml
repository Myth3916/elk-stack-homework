networks:
  elk:
    driver: bridge

volumes:
  es-hot-data:
  es-warm-data:
  filebeat-data:

services:
  es-hot:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    container_name: es-hot
    restart: unless-stopped
    environment:
      - node.name=es-hot
      - cluster.name=elk-homework
      - discovery.seed_hosts=es-hot,es-warm
      - cluster.initial_master_nodes=es-hot,es-warm
      - node.attr.box_type=hot
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-hot-data:/usr/share/elasticsearch/data
    networks:
      - elk
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'You Know, for Search' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  es-warm:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    container_name: es-warm
    restart: unless-stopped
    depends_on:
      es-hot:
        condition: service_healthy
    environment:
      - node.name=es-warm
      - cluster.name=elk-homework
      - discovery.seed_hosts=es-hot,es-warm
      - cluster.initial_master_nodes=es-hot,es-warm
      - node.attr.box_type=warm
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-warm-data:/usr/share/elasticsearch/data
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'You Know, for Search' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.22
    container_name: logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      es-hot:
        condition: service_healthy
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5044:5044"
      - "5000:5000"
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.22
    container_name: kibana
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
    depends_on:
      es-hot:
        condition: service_healthy
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - elk

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.22
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e -strict.perms=false
    depends_on:
      - logstash
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    networks:
      - elk