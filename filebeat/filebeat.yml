filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

processors:
  - add_docker_metadata: ~
  - add_host_metadata: ~
  - drop_event:
      when:
        equals:
          container.name: logstash

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info